<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Support Equipment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Settings, ExternalLink, ChevronRight, ChevronLeft, 
          X, Save, User, HardHat, Truck, Car, Wrench, FileText, Anchor,
          Droplet, Users, GraduationCap, ClipboardEdit, Plus, Trash2, Loader2,
          Menu, Lock, LayoutGrid
        } from 'lucide-react';

        const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkJl7PeW5VQVX4errbzpm8psAMp5RxzAPnzqCA0Smj_r3mDgRylWC-1So5ZJl2jr6d5g/exec"; 
        const CACHE_KEY = "portal_se_data_v4";

        const defaultData = {
          settingsPassword: "123456Fa",
          hero: {
            title: "Portal Support Equipment",
            subtitle: "Pusat Informasi Operasional, Pemeliharaan, dan Manajemen Divisi",
            imageUrl: "https://lh3.googleusercontent.com/d/1x2INLTU76tuRcg_e4l3TLHeKBrXg4z6N", 
            logoUrl: ""
          },
          about: "Section Support Equipment bertindak sebagai tulang punggung operasional yang menjamin kelancaran, efisiensi, dan keselamatan kerja seluruh tim di lapangan. Kami bertanggung jawab memfasilitasi kebutuhan teknis lapangan secara menyeluruh, mulai dari perawatan rutin armada seperti pengisian pelumas, greasing, dan pembersihan unit, hingga penanganan serta pengangkutan material berat secara aman dan terintegrasi.",
          aboutImageUrl: "",
          slides: [
            { id: "s1", title: "LUKMANUL HAKIM", imageUrl: "", links: [] },
            { id: "s2", title: "FADILLAH", imageUrl: "", links: [] },
            { id: "s3", title: "OPERASIONAL", imageUrl: "", links: [] }
          ],
          manpower: [
            { id: "m1", label: "Staf", count: 12, icon: "User" },
            { id: "m2", label: "Admin", count: 8, icon: "ClipboardEdit" },
            { id: "m3", label: "Driver LV", count: 35, icon: "Car" },
            { id: "m4", label: "Operator WT", count: 20, icon: "Droplet" }
          ],
          units: [
            { id: "u1", label: "Light Truck (LT)", count: 24, icon: "Truck" },
            { id: "u2", label: "Water Truck (WT)", count: 12, icon: "Droplet" },
            { id: "u3", label: "Crane Truck (CT)", count: 6, icon: "Anchor" }
          ]
        };

        const IconMapper = ({ name, size = 24, className = "" }) => {
          const icons = { User, HardHat, Truck, Car, Wrench, FileText, Anchor, Droplet, Users, GraduationCap, ClipboardEdit };
          const IconComponent = icons[name] || FileText;
          return <IconComponent size={size} className={className} />;
        };

        function App() {
          const [data, setData] = useState(() => {
            const cached = localStorage.getItem(CACHE_KEY);
            return cached ? JSON.parse(cached) : defaultData;
          });
          const [loading, setLoading] = useState(!localStorage.getItem(CACHE_KEY));
          
          const [activeSlide, setActiveSlide] = useState(0);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [isAuthOpen, setIsAuthOpen] = useState(false);
          const [passwordInput, setPasswordInput] = useState("");
          const [authError, setAuthError] = useState("");
          const [isAuthenticated, setIsAuthenticated] = useState(false);
          const [settingsDraft, setSettingsDraft] = useState(defaultData);
          const [activeSettingsTab, setActiveSettingsTab] = useState('general');

          const touchStartX = useRef(null);
          const touchEndX = useRef(null);
          const isDragging = useRef(false);
          const minSwipeDistance = 50;

          useEffect(() => {
            const fetchLatestData = async () => {
              try {
                const response = await fetch(APPSCRIPT_URL); 
                const sheetData = await response.json();
                if (sheetData && !sheetData.message) {
                  setData(sheetData);
                  localStorage.setItem(CACHE_KEY, JSON.stringify(sheetData)); 
                }
              } catch (error) {
                console.warn("Gagal mengambil data dari Google Sheet:", error);
              } finally {
                setLoading(false);
              }
            };
            fetchLatestData();
          }, []);

          useEffect(() => {
            if (isSettingsOpen || isAuthOpen) document.body.classList.add('overflow-hidden');
            else document.body.classList.remove('overflow-hidden');
          }, [isSettingsOpen, isAuthOpen]);

          const handleDragStart = (e) => {
            touchStartX.current = e.touches ? e.touches[0].clientX : e.clientX;
            isDragging.current = true;
          };
          const handleDragMove = (e) => {
            if (!isDragging.current) return;
            touchEndX.current = e.touches ? e.touches[0].clientX : e.clientX;
          };
          const handleDragEnd = () => {
            if (!isDragging.current) return;
            isDragging.current = false;
            if (!touchStartX.current || !touchEndX.current) return;
            const distance = touchStartX.current - touchEndX.current;
            if (distance > minSwipeDistance) handleNextSlide();
            else if (distance < -minSwipeDistance) handlePrevSlide();
            touchStartX.current = null;
            touchEndX.current = null;
          };
          const handleMouseLeave = () => {
            isDragging.current = false;
            touchStartX.current = null;
            touchEndX.current = null;
          };

          const handleNextSlide = () => {
            if(data.slides && data.slides.length > 0) setActiveSlide((prev) => (prev + 1) % data.slides.length);
          };
          const handlePrevSlide = () => {
            if(data.slides && data.slides.length > 0) setActiveSlide((prev) => (prev - 1 + data.slides.length) % data.slides.length);
          };

          const getSlideStyle = (index) => {
            if (!data.slides || data.slides.length === 0) return "hidden";
            const length = data.slides.length;
            
            let offset = (index - activeSlide + length) % length;
            // Koreksi offset agar berada di tengah (contoh untuk 5 item: -2, -1, 0, 1, 2)
            if (offset > Math.floor(length / 2)) offset -= length;

            // Foto Tengah
            if (offset === 0) {
              return "translate-x-0 scale-100 opacity-100 z-50 drop-shadow-[0_15px_15px_rgba(0,0,0,0.4)]";
            } 
            // Foto Sebelah Kanan & Kiri Langsung
            else if (offset === 1) {
              return "translate-x-[75%] sm:translate-x-[105%] scale-[0.85] opacity-75 z-40 cursor-pointer hover:opacity-100 blur-[1px]";
            } else if (offset === -1) {
              return "-translate-x-[75%] sm:-translate-x-[105%] scale-[0.85] opacity-75 z-40 cursor-pointer hover:opacity-100 blur-[1px]";
            } 
            // Foto Paling Ujung Kanan & Kiri
            else if (offset === 2) {
              return "translate-x-[140%] sm:translate-x-[200%] scale-[0.65] opacity-40 z-30 cursor-pointer hover:opacity-60 blur-[2px]";
            } else if (offset === -2) {
              return "-translate-x-[140%] sm:-translate-x-[200%] scale-[0.65] opacity-40 z-30 cursor-pointer hover:opacity-60 blur-[2px]";
            }
            
            // Sisa foto disembunyikan
            return "translate-x-0 scale-50 opacity-0 z-0 pointer-events-none hidden";
          };

          const handleOpenSettings = () => {
            setIsMobileMenuOpen(false);
            if (isAuthenticated) {
              setSettingsDraft(JSON.parse(JSON.stringify(data)));
              setIsSettingsOpen(true);
            } else {
              setPasswordInput("");
              setAuthError("");
              setIsAuthOpen(true);
            }
          };

          const handleAuthSubmit = (e) => {
            e.preventDefault();
            const correctPassword = data.settingsPassword || "123456Fa";
            if (passwordInput === correctPassword) {
              setIsAuthenticated(true);
              setIsAuthOpen(false);
              setSettingsDraft(JSON.parse(JSON.stringify(data)));
              setIsSettingsOpen(true);
            } else {
              setAuthError("Kata sandi salah. Silakan coba lagi.");
            }
          };

          const handleSaveSettings = async () => {
            if(!settingsDraft.slides) settingsDraft.slides = [];
            
            setData(settingsDraft); 
            localStorage.setItem(CACHE_KEY, JSON.stringify(settingsDraft));
            setIsSettingsOpen(false);
            
            try {
              await fetch(APPSCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify(settingsDraft)
              });
            } catch (err) {
              console.error("Gagal menyimpan ke Spreadsheet:", err);
              alert("Gagal menyimpan data ke server Google Sheet.");
            }
          };

          return (
            <div className="min-h-screen font-sans text-slate-800 flex flex-col bg-gray-50">
              
              <header className="sticky top-0 z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  <div className="flex items-center cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                    {data.hero?.logoUrl ? (
                      <img src={data.hero.logoUrl} alt="Logo Perusahaan" className={`h-10 sm:h-12 w-auto max-w-[250px] object-contain drop-shadow-sm ${loading ? 'animate-pulse opacity-70' : ''}`} />
                    ) : (
                      <div className="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-br from-blue-600 to-orange-500 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md">
                        {loading ? <Loader2 className="w-5 h-5 animate-spin" /> : "SE"}
                      </div>
                    )}
                  </div>
                  
                  <nav className="hidden md:flex items-center gap-6 lg:gap-8 font-medium text-slate-600">
                    <a href="#menu" className="hover:text-blue-600 transition-colors py-2">Menu</a>
                    <a href="#tentang-se" className="hover:text-blue-600 transition-colors py-2">Tentang</a>
                    <a href="#populasi" className="hover:text-blue-600 transition-colors py-2">Populasi</a>
                    
                    <button onClick={handleOpenSettings} className="p-2 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors ml-4" title="Pengaturan Portal">
                      <Settings className="w-5 h-5" />
                    </button>
                  </nav>

                  <div className="md:hidden flex items-center">
                    <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 text-slate-700 hover:bg-gray-100 rounded-lg border border-gray-200 focus:outline-none">
                      {isMobileMenuOpen ? <X className="w-7 h-7" /> : <Menu className="w-7 h-7" />}
                    </button>
                  </div>
                </div>

                {isMobileMenuOpen && (
                  <div className="md:hidden absolute top-16 left-0 w-full bg-white border-b border-gray-200 shadow-xl px-4 py-4 flex flex-col gap-2 z-50 rounded-b-2xl">
                    <a href="#menu" onClick={() => setIsMobileMenuOpen(false)} className="px-4 py-3 text-slate-700 font-bold hover:bg-gray-50 rounded-xl">Menu Akses</a>
                    <a href="#tentang-se" onClick={() => setIsMobileMenuOpen(false)} className="px-4 py-3 text-slate-700 font-bold hover:bg-gray-50 rounded-xl">Tentang Support Equipment</a>
                    <a href="#populasi" onClick={() => setIsMobileMenuOpen(false)} className="px-4 py-3 text-slate-700 font-bold hover:bg-gray-50 rounded-xl">Populasi Data</a>
                    <div className="h-px bg-gray-100 my-2"></div>
                    <button onClick={handleOpenSettings} className="px-4 py-3 text-left text-blue-600 font-bold hover:bg-blue-50 rounded-xl flex items-center gap-3">
                      <Settings className="w-5 h-5" /> Pengaturan Portal
                    </button>
                  </div>
                )}
              </header>

              <main className="flex-1 pb-10">
                <section className="w-full relative h-[300px] sm:h-[400px] md:h-[500px] bg-slate-900 overflow-hidden">
                  {data.hero?.imageUrl && (
                    <img src={data.hero.imageUrl} alt="Hero" className="w-full h-full object-cover opacity-80" />
                  )}
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900/95 via-slate-900/40 to-transparent"></div>
                  <div className="absolute bottom-0 w-full">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-10 sm:pb-16 text-white">
                      <h1 className="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight mb-4 drop-shadow-xl">
                        {data.hero?.title}
                      </h1>
                      <p className="text-base sm:text-xl md:text-2xl text-gray-200 max-w-3xl drop-shadow-md font-medium leading-relaxed">
                        {data.hero?.subtitle}
                      </p>
                    </div>
                  </div>
                </section>

                <section id="menu" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-16 overflow-hidden scroll-mt-24">
                  <div className="flex flex-col items-center justify-center">
                    
                    <div className="w-full max-w-5xl mb-12">
                      <div className="flex items-center justify-start mb-8 px-2 gap-3 sm:gap-4">
                        <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-slate-800 text-white flex items-center justify-center shadow-lg shrink-0">
                          <LayoutGrid className="w-5 h-5 sm:w-6 sm:h-6" />
                        </div>
                        <h3 className="text-2xl sm:text-3xl font-black text-slate-800 tracking-widest uppercase">
                          MENU
                        </h3>
                      </div>
                      
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">
                        {(data.slides && data.slides[activeSlide]?.links) ? data.slides[activeSlide].links.map((link) => (
                          <a key={link.id} href={link.url} target="_blank" rel="noopener noreferrer" className="group flex items-center justify-between p-4 sm:p-5 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:border-blue-200 transition-all duration-300 transform hover:-translate-y-1">
                            <span className="font-semibold text-slate-700 group-hover:text-blue-700 transition-colors truncate pr-4">{link.label}</span>
                            <div className="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center group-hover:bg-blue-100 transition-colors shrink-0">
                              <ChevronRight className="w-4 h-4 text-blue-600" />
                            </div>
                          </a>
                        )) : (
                          <div className="col-span-full text-center py-8 text-gray-400 bg-gray-50 rounded-2xl border border-dashed border-gray-200">Tidak ada tautan untuk kategori ini.</div>
                        )}
                      </div>
                    </div>

                    <div className="relative w-full max-w-full md:max-w-5xl h-[220px] sm:h-[300px] flex items-center justify-center perspective-1000 cursor-grab active:cursor-grabbing touch-pan-y mt-4"
                      onTouchStart={handleDragStart} onTouchMove={handleDragMove} onTouchEnd={handleDragEnd}
                      onMouseDown={handleDragStart} onMouseMove={handleDragMove} onMouseUp={handleDragEnd} onMouseLeave={handleMouseLeave}>
                      
                      {data.slides && data.slides.map((slide, index) => (
                        <div key={slide.id} className={`absolute w-[130px] sm:w-[170px] h-[180px] sm:h-[240px] transition-all duration-700 ease-out bg-transparent ${getSlideStyle(index)} flex flex-col justify-end`} onClick={() => setActiveSlide(index)}>
                          {slide.imageUrl && (
                            <img draggable={false} src={slide.imageUrl} alt={slide.title} className="w-full h-full object-contain select-none pointer-events-none drop-shadow-[0_15px_10px_rgba(0,0,0,0.2)]" />
                          )}
                          <div className={`absolute bottom-0 left-0 w-full transition-opacity duration-300 flex justify-center ${index === activeSlide ? 'opacity-100' : 'opacity-0'}`}>
                            <span className="bg-slate-800 text-white text-[10px] sm:text-xs font-bold px-4 py-2 rounded-full shadow-lg text-center truncate uppercase tracking-wider w-max max-w-full z-10">
                              {slide.title}
                            </span>
                          </div>
                        </div>
                      ))}
                      
                      <button onClick={handlePrevSlide} className="absolute left-0 sm:left-4 md:-left-4 z-50 p-2 sm:p-3 bg-white/90 hover:bg-white text-slate-800 rounded-full shadow-lg backdrop-blur hover:scale-110 transition-all border border-gray-100">
                        <ChevronLeft className="w-5 h-5 sm:w-6 sm:h-6" />
                      </button>
                      <button onClick={handleNextSlide} className="absolute right-0 sm:right-4 md:-right-4 z-50 p-2 sm:p-3 bg-white/90 hover:bg-white text-slate-800 rounded-full shadow-lg backdrop-blur hover:scale-110 transition-all border border-gray-100">
                        <ChevronRight className="w-5 h-5 sm:w-6 sm:h-6" />
                      </button>
                    </div>
                  </div>
                </section>

                <section id="tentang-se" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-24 scroll-mt-24">
                  <div className="bg-white rounded-[2rem] sm:rounded-[3rem] p-8 sm:p-14 shadow-sm border border-gray-100 relative overflow-hidden">
                    <div className="absolute -top-20 -right-20 w-64 h-64 bg-blue-50 rounded-full opacity-50 blur-3xl"></div>
                    <div className="relative z-10 flex flex-col md:flex-row gap-8 sm:gap-12 items-center">
                      
                      {data.aboutImageUrl ? (
                        <div className="w-full sm:w-1/2 md:w-2/5 shrink-0 flex justify-center relative">
                          <img src={data.aboutImageUrl} alt="Tentang Kami" className="w-full max-w-[400px] h-auto object-contain relative z-10" />
                        </div>
                      ) : (
                        <div className="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center shrink-0 shadow-sm border border-blue-100">
                          <FileText className="w-10 h-10" />
                        </div>
                      )}
                      
                      <div className="flex-1">
                        <h2 className="text-4xl sm:text-5xl font-black text-slate-800 mb-2 tracking-tight uppercase">TENTANG KAMI</h2>
                        <h3 className="text-xl sm:text-2xl font-bold text-red-600 tracking-widest mb-8 uppercase">Support Equipment</h3>
                        <p className="text-slate-600 leading-[2rem] sm:leading-[2.5rem] text-xl sm:text-2xl font-medium text-justify whitespace-pre-wrap">{data.about}</p>
                      </div>
                    </div>
                  </div>
                </section>

                <section id="populasi" className="mt-24 py-20 bg-slate-100 border-y border-gray-200 scroll-mt-20">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    
                    <div className="mb-24">
                      <div className="text-center mb-16">
                        <h2 className="text-lg sm:text-xl font-bold text-slate-400 uppercase tracking-[0.2em]">Populasi Manpower</h2>
                      </div>
                      <div className="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 sm:gap-10 justify-items-center">
                        {data.manpower && data.manpower.map((stat, idx) => (
                          <div key={stat.id || idx} className="flex flex-col items-center group w-full text-center">
                            <div className="mb-3 text-slate-300 group-hover:text-blue-600 transition-colors duration-300">
                              <IconMapper name={stat.icon} size={36} className="fill-current stroke-0 mx-auto sm:w-12 sm:h-12" />
                            </div>
                            <div className="flex flex-col items-center">
                              <span className="text-slate-800 text-4xl sm:text-5xl lg:text-6xl font-light tracking-tighter leading-none group-hover:scale-105 transition-transform duration-300">{stat.count}</span>
                              <div className="w-8 sm:w-12 h-[2px] sm:h-[3px] bg-slate-200 group-hover:bg-blue-600 mt-2 sm:mt-3 mb-2 transition-colors duration-300"></div>
                              <span className="text-slate-500 text-[10px] sm:text-xs font-bold tracking-widest uppercase break-words w-full px-1">{stat.label}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div>
                      <div className="text-center mb-16">
                        <h2 className="text-lg sm:text-xl font-bold text-slate-400 uppercase tracking-[0.2em]">Populasi Unit</h2>
                      </div>
                      <div className="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-3 gap-6 sm:gap-10 justify-items-center max-w-4xl mx-auto">
                        {data.units && data.units.map((stat, idx) => (
                          <div key={stat.id || idx} className="flex flex-col items-center group w-full text-center">
                            <div className="mb-3 text-slate-300 group-hover:text-orange-500 transition-colors duration-300">
                              <IconMapper name={stat.icon} size={36} className="fill-current stroke-0 mx-auto sm:w-12 sm:h-12" />
                            </div>
                            <div className="flex flex-col items-center">
                              <span className="text-slate-800 text-4xl sm:text-5xl lg:text-6xl font-light tracking-tighter leading-none group-hover:scale-105 transition-transform duration-300">{stat.count}</span>
                              <div className="w-8 sm:w-12 h-[2px] sm:h-[3px] bg-slate-200 group-hover:bg-orange-500 mt-2 sm:mt-3 mb-2 transition-colors duration-300"></div>
                              <span className="text-slate-500 text-[10px] sm:text-xs font-bold tracking-widest uppercase break-words w-full px-1">{stat.label}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </section>
              </main>

              <footer className="bg-white py-6">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex flex-col items-center justify-center">
                  <span className="italic text-slate-400/80 text-sm font-medium">created by fadillahm</span>
                </div>
              </footer>

              {/* Autentikasi Pengaturan */}
              {isAuthOpen && (
                <div className="fixed inset-0 z-[110] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
                    <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-slate-50">
                      <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <Lock className="text-blue-600 w-6 h-6" /> Keamanan Portal
                      </h2>
                      <button onClick={() => setIsAuthOpen(false)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors">
                        <X className="w-5 h-5" />
                      </button>
                    </div>
                    <form onSubmit={handleAuthSubmit} className="p-6">
                      <p className="text-sm text-gray-600 mb-4">Silakan masukkan kata sandi Anda untuk mengakses menu pengaturan portal.</p>
                      <input 
                        type="password" 
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        placeholder="Masukkan Kata Sandi"
                        className="w-full p-4 border border-gray-200 rounded-xl bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none mb-2 text-center text-lg tracking-widest"
                        autoFocus
                      />
                      {authError && <p className="text-red-500 text-sm font-medium mb-4 text-center">{authError}</p>}
                      <div className="mt-6 flex gap-3">
                        <button type="button" onClick={() => setIsAuthOpen(false)} className="flex-1 px-5 py-3 rounded-xl font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">Batal</button>
                        <button type="submit" className="flex-1 px-5 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow-lg shadow-blue-500/30">Buka Akses</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Modal Pengaturan */}
              {isSettingsOpen && (
                <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-5xl h-[90vh] flex flex-col">
                    <div className="p-5 sm:p-6 border-b border-gray-100 flex justify-between items-center bg-slate-50 rounded-t-3xl shrink-0">
                      <h2 className="text-xl sm:text-2xl font-bold text-slate-800 flex items-center gap-2">
                        <Settings className="text-blue-600 w-6 h-6" /> Pengaturan Portal
                      </h2>
                      <button onClick={() => setIsSettingsOpen(false)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors">
                        <X className="w-6 h-6" />
                      </button>
                    </div>
                    
                    <div className="flex-1 overflow-hidden flex flex-col md:flex-row">
                      <div className="w-full md:w-64 space-y-1 p-4 sm:p-6 border-b md:border-b-0 md:border-r border-gray-100 bg-white overflow-y-auto shrink-0 flex md:block gap-2">
                        {[{ id: 'general', label: 'Umum & Teks' }, { id: 'slides', label: 'Slider & Link' }, { id: 'manpower', label: 'Manpower' }, { id: 'units', label: 'Data Unit' }, { id: 'security', label: 'Keamanan' }].map(tab => (
                          <button key={tab.id} onClick={() => setActiveSettingsTab(tab.id)} className={`w-full text-left px-4 py-3 rounded-xl font-medium transition-colors whitespace-nowrap ${activeSettingsTab === tab.id ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'}`}>{tab.label}</button>
                        ))}
                      </div>

                      <div className="flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-50/50">
                        <div className="max-w-3xl space-y-6">
                          
                          {activeSettingsTab === 'general' && (
                            <div className="space-y-5">
                              <div><label className="block text-sm font-medium text-gray-700 mb-1">URL Logo Perusahaan</label><input type="text" value={settingsDraft.hero?.logoUrl || ''} onChange={e => setSettingsDraft({...settingsDraft, hero: {...settingsDraft.hero, logoUrl: e.target.value}})} className="w-full p-3 border border-gray-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 text-sm" /></div>
                              <div><label className="block text-sm font-medium text-gray-700 mb-1">Judul Hero (Layar Penuh)</label><input type="text" value={settingsDraft.hero?.title || ''} onChange={e => setSettingsDraft({...settingsDraft, hero: {...settingsDraft.hero, title: e.target.value}})} className="w-full p-3 border border-gray-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500" /></div>
                              <div><label className="block text-sm font-medium text-gray-700 mb-1">Sub-Judul Hero</label><input type="text" value={settingsDraft.hero?.subtitle || ''} onChange={e => setSettingsDraft({...settingsDraft, hero: {...settingsDraft.hero, subtitle: e.target.value}})} className="w-full p-3 border border-gray-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500" /></div>
                              <div><label className="block text-sm font-medium text-gray-700 mb-1">URL Foto Background Hero</label><input type="text" value={settingsDraft.hero?.imageUrl || ''} onChange={e => setSettingsDraft({...settingsDraft, hero: {...settingsDraft.hero, imageUrl: e.target.value}})} className="w-full p-3 border border-gray-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 text-sm" /></div>
                              <hr className="my-6 border-gray-200" />
                              <div><label className="block text-sm font-bold text-gray-800 mb-1">URL Foto 'Tentang Kami' (Bisa format vertikal/full)</label><input type="text" placeholder="Kosongkan untuk pakai ikon dokumen standar" value={settingsDraft.aboutImageUrl || ''} onChange={e => setSettingsDraft({...settingsDraft, aboutImageUrl: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500 text-sm" /></div>
                              <div><label className="block text-sm font-medium text-gray-700 mb-1">Teks Penjelasan 'Tentang Kami'</label><textarea value={settingsDraft.about || ''} rows={6} onChange={e => setSettingsDraft({...settingsDraft, about: e.target.value})} className="w-full p-3 border border-gray-200 rounded-xl bg-white focus:ring-2 focus:ring-blue-500"></textarea></div>
                            </div>
                          )}

                          {activeSettingsTab === 'slides' && (
                            <div className="space-y-8">
                              {settingsDraft.slides && settingsDraft.slides.map((slide, sIdx) => (
                                <div key={slide.id || sIdx} className="p-5 border border-gray-200 rounded-2xl bg-white shadow-sm space-y-4">
                                  
                                  <div className="flex justify-between items-center pb-2 border-b border-gray-100">
                                    <h4 className="text-sm font-bold text-slate-700">Kategori {sIdx + 1}</h4>
                                    <button 
                                      onClick={() => { 
                                        if(window.confirm('Yakin ingin menghapus kategori ini?')) {
                                          const newSlides = [...settingsDraft.slides]; 
                                          newSlides.splice(sIdx, 1); 
                                          setSettingsDraft({...settingsDraft, slides: newSlides}); 
                                        }
                                      }} 
                                      className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg flex items-center gap-2 text-xs font-bold transition-colors"
                                    >
                                      <Trash2 className="w-4 h-4" /> Hapus Kategori
                                    </button>
                                  </div>

                                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div><label className="block text-xs font-bold text-gray-600 uppercase mb-1">Nama Kategori</label><input type="text" value={slide.title} onChange={e => { const newSlides = [...settingsDraft.slides]; newSlides[sIdx].title = e.target.value; setSettingsDraft({...settingsDraft, slides: newSlides}); }} className="w-full p-2.5 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 font-semibold" /></div>
                                    <div><label className="block text-xs font-bold text-gray-600 uppercase mb-1">URL Foto (Carousel)</label><input type="text" value={slide.imageUrl} onChange={e => { const newSlides = [...settingsDraft.slides]; newSlides[sIdx].imageUrl = e.target.value; setSettingsDraft({...settingsDraft, slides: newSlides}); }} className="w-full p-2.5 border border-gray-200 rounded-lg bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 text-sm" /></div>
                                  </div>
                                  
                                  <div className="pt-4 border-t border-gray-100">
                                    <label className="block text-xs font-bold text-blue-600 uppercase mb-3">Tautan di Dalam Kategori Ini</label>
                                    <div className="space-y-2">
                                      {slide.links?.map((link, lIdx) => (
                                        <div key={link.id || lIdx} className="flex flex-col sm:flex-row gap-2 bg-gray-50 p-2 rounded-xl border border-gray-100">
                                          <input type="text" placeholder="Nama Tombol" value={link.label} onChange={e => { const newSlides = [...settingsDraft.slides]; newSlides[sIdx].links[lIdx].label = e.target.value; setSettingsDraft({...settingsDraft, slides: newSlides}); }} className="flex-1 w-full p-2.5 border border-gray-200 rounded-lg text-sm" />
                                          <input type="text" placeholder="URL Target" value={link.url} onChange={e => { const newSlides = [...settingsDraft.slides]; newSlides[sIdx].links[lIdx].url = e.target.value; setSettingsDraft({...settingsDraft, slides: newSlides}); }} className="flex-1 w-full p-2.5 border border-gray-200 rounded-lg text-sm" />
                                          <button onClick={() => { const newSlides = [...settingsDraft.slides]; newSlides[sIdx].links.splice(lIdx, 1); setSettingsDraft({...settingsDraft, slides: newSlides}); }} className="p-2.5 text-red-500 hover:bg-red-100 rounded-lg self-end sm:self-auto"><Trash2 className="w-4 h-4" /></button>
                                        </div>
                                      ))}
                                      <button onClick={() => { const newSlides = [...settingsDraft.slides]; if (!newSlides[sIdx].links) newSlides[sIdx].links = []; newSlides[sIdx].links.push({ id: Date.now().toString(), label: "Tautan Baru", url: "" }); setSettingsDraft({...settingsDraft, slides: newSlides}); }} className="flex items-center gap-1 text-sm text-blue-600 hover:bg-blue-50 py-2.5 px-3 rounded-lg font-semibold transition-colors"><Plus className="w-4 h-4" /> Tambah Tautan</button>
                                    </div>
                                  </div>
                                </div>
                              ))}

                              {/* TOMBOL TAMBAH KATEGORI BARU */}
                              <button 
                                onClick={() => { 
                                  const newSlides = [...(settingsDraft.slides || []), { 
                                    id: Date.now().toString(), 
                                    title: "Kategori Baru", 
                                    imageUrl: "", 
                                    links: [] 
                                  }];
                                  setSettingsDraft({...settingsDraft, slides: newSlides}); 
                                }} 
                                className="w-full flex items-center justify-center gap-2 py-4 border-2 border-dashed border-blue-300 rounded-2xl text-blue-600 hover:text-blue-700 hover:border-blue-400 hover:bg-blue-50 font-bold transition-colors"
                              >
                                <Plus className="w-5 h-5" /> Tambah Kategori Baru
                              </button>
                            </div>
                          )}

                          {activeSettingsTab === 'manpower' && (
                            <div className="space-y-4">
                              <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl text-sm text-blue-800 font-medium mb-6">Kelola daftar jabatan Manpower. Data ini akan ditampilkan dalam 3 kolom pada versi HP.</div>
                              {settingsDraft.manpower && settingsDraft.manpower.map((item, idx) => (
                                <div key={item.id || idx} className="flex gap-3 items-center bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                                  <div className="p-2 bg-gray-50 rounded-lg border border-gray-100 text-gray-400"><IconMapper name={item.icon} size={20} /></div>
                                  <input type="text" value={item.label} onChange={e => { const newMp = [...settingsDraft.manpower]; newMp[idx].label = e.target.value; setSettingsDraft({...settingsDraft, manpower: newMp}); }} className="flex-1 p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 font-medium" />
                                  <input type="number" value={item.count} onChange={e => { const newMp = [...settingsDraft.manpower]; newMp[idx].count = parseInt(e.target.value) || 0; setSettingsDraft({...settingsDraft, manpower: newMp}); }} className="w-24 p-2 border border-gray-200 rounded-lg text-center font-bold focus:ring-2 focus:ring-blue-500" />
                                  <button onClick={() => { const newMp = [...settingsDraft.manpower]; newMp.splice(idx, 1); setSettingsDraft({...settingsDraft, manpower: newMp}); }} className="p-2 text-red-500 hover:bg-red-50 rounded-lg"><Trash2 className="w-5 h-5" /></button>
                                </div>
                              ))}
                              <button onClick={() => setSettingsDraft({ ...settingsDraft, manpower: [...(settingsDraft.manpower||[]), { id: Date.now().toString(), label: "Jabatan Baru", count: 0, icon: "User" }]})} className="w-full flex items-center justify-center gap-2 py-3.5 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50 font-medium"><Plus className="w-5 h-5" /> Tambah Data Manpower</button>
                            </div>
                          )}

                          {activeSettingsTab === 'units' && (
                            <div className="space-y-4">
                              <div className="bg-orange-50 border border-orange-100 p-4 rounded-xl text-sm text-orange-800 font-medium mb-6">Kelola daftar Alat/Unit. Data ini akan ditampilkan dalam 3 kolom pada versi HP.</div>
                              {settingsDraft.units && settingsDraft.units.map((item, idx) => (
                                <div key={item.id || idx} className="flex gap-3 items-center bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                                  <div className="p-2 bg-gray-50 rounded-lg border border-gray-100 text-gray-400"><IconMapper name={item.icon} size={20} /></div>
                                  <input type="text" value={item.label} onChange={e => { const newUnits = [...settingsDraft.units]; newUnits[idx].label = e.target.value; setSettingsDraft({...settingsDraft, units: newUnits}); }} className="flex-1 p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 font-medium" />
                                  <input type="number" value={item.count} onChange={e => { const newUnits = [...settingsDraft.units]; newUnits[idx].count = parseInt(e.target.value) || 0; setSettingsDraft({...settingsDraft, units: newUnits}); }} className="w-24 p-2 border border-gray-200 rounded-lg text-center font-bold focus:ring-2 focus:ring-blue-500" />
                                  <button onClick={() => { const newUnits = [...settingsDraft.units]; newUnits.splice(idx, 1); setSettingsDraft({...settingsDraft, units: newUnits}); }} className="p-2 text-red-500 hover:bg-red-50 rounded-lg"><Trash2 className="w-5 h-5" /></button>
                                </div>
                              ))}
                              <button onClick={() => setSettingsDraft({ ...settingsDraft, units: [...(settingsDraft.units||[]), { id: Date.now().toString(), label: "Unit Baru", count: 0, icon: "Truck" }]})} className="w-full flex items-center justify-center gap-2 py-3.5 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:text-orange-600 hover:border-orange-400 hover:bg-orange-50 font-medium"><Plus className="w-5 h-5" /> Tambah Data Unit</button>
                            </div>
                          )}

                          {activeSettingsTab === 'security' && (
                            <div className="space-y-4">
                              <div className="bg-red-50 border border-red-100 p-5 rounded-2xl">
                                <h3 className="font-bold text-red-800 mb-2 flex items-center gap-2"><Lock className="w-5 h-5"/> Ubah Kata Sandi Pengaturan</h3>
                                <p className="text-sm text-red-700 mb-4">Ubah kata sandi untuk mencegah akses tidak sah ke menu ini. Ingat baik-baik kata sandi baru Anda.</p>
                                
                                <div>
                                  <label className="block text-sm font-bold text-gray-800 mb-2">Kata Sandi Baru</label>
                                  <input 
                                    type="text" 
                                    value={settingsDraft.settingsPassword || ''} 
                                    onChange={e => setSettingsDraft({...settingsDraft, settingsPassword: e.target.value})} 
                                    className="w-full p-4 border border-gray-300 rounded-xl bg-white focus:ring-2 focus:ring-red-500 font-mono tracking-wider" 
                                  />
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>

                    <div className="p-4 sm:p-6 border-t border-gray-100 bg-white flex justify-end gap-3 rounded-b-3xl shrink-0">
                      <button onClick={() => setIsSettingsOpen(false)} className="px-5 py-3 rounded-xl font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">Batal</button>
                      <button onClick={handleSaveSettings} className="px-6 py-3 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 flex items-center gap-2 shadow-lg shadow-blue-500/30">
                        <Save className="w-5 h-5" /> Simpan & Terapkan
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
