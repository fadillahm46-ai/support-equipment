<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Support Equipment</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">

  <!-- Peta Modul React & Lucide -->
  <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0"
        }
    }
    </script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Settings, Save, User, HardHat, Truck, Car,
      Wrench, FileText, Anchor, Droplet, Users,
      GraduationCap, ClipboardEdit
    } from 'lucide-react';

    // URL GOOGLE APPS SCRIPT ANDA
    const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkJl7PeW5VQVX4errbzpm8psAMp5RxzAPnzqCA0Smj_r3mDgRylWC-1So5ZJl2jr6d5g/exec";

    const defaultData = {
      hero: {
        title: "Portal Support Equipment",
        subtitle: "Pusat Informasi Operasional, Pemeliharaan, dan Manajemen Divisi",
        imageUrl: "https://lh3.googleusercontent.com/d/1x2INLTU76tuRcg_e4l3TLHeKBrXg4z6N",
        logoUrl: ""
      },
      manpower: [
        { id: "m1", label: "Staf", count: 12, icon: "User" },
        { id: "m2", label: "Admin", count: 8, icon: "ClipboardEdit" },
        { id: "m3", label: "Driver LV", count: 35, icon: "Car" },
        { id: "m4", label: "Operator WT", count: 20, icon: "Droplet" }
      ],
      units: [
        { id: "u1", label: "Light Truck (LT)", count: 24, icon: "Truck" },
        { id: "u2", label: "Water Truck (WT)", count: 12, icon: "Droplet" },
        { id: "u3", label: "Crane Truck (CT)", count: 6, icon: "Anchor" }
      ]
    };

    const IconMapper = ({ name, size = 24, className = "" }) => {
      const icons = { User, HardHat, Truck, Car, Wrench, FileText, Anchor, Droplet, Users, GraduationCap, ClipboardEdit };
      const IconComponent = icons[name] || FileText;
      return <IconComponent size={size} className={className} />;
    };

    function App() {
      const [data, setData] = useState(defaultData);
      const [loading, setLoading] = useState(true);

      // FETCH DATA DARI SPREADSHEET
      useEffect(() => {
        const fetchData = async () => {
          try {
            const response = await fetch(APPSCRIPT_URL);
            const sheetData = await response.json();
            if (sheetData && !sheetData.message) setData(sheetData);
          } catch (error) {
            console.warn("Gagal mengambil data dari Google Sheet:", error);
          } finally {
            setLoading(false);
          }
        };
        fetchData();
      }, []);

      // SAVE DATA KE SPREADSHEET
      const handleSaveSettings = async () => {
        try {
          await fetch(APPSCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(data) // Mengirim state data saat ini
          });
          alert("Data berhasil disimpan ke Google Spreadsheet!");
        } catch (err) {
          console.error("Error:", err);
          alert("Gagal menyimpan data ke server Google Sheet.");
        }
      };

      if (loading) return <div className="flex h-screen items-center justify-center text-xl font-bold animate-pulse text-slate-500">Memuat Portal...</div>;

      return (
        <div className="min-h-screen pb-20">
          {/* Header Banner */}
          <div className="relative h-[350px] w-full bg-slate-800 shadow-xl overflow-hidden rounded-b-[40px]">
            <img src={data.hero.imageUrl} className="absolute inset-0 w-full h-full object-cover opacity-40" alt="Hero" />
            <div className="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
            <div className="absolute bottom-10 left-8 text-white z-10 pr-10">
              <h1 className="text-4xl font-extrabold mb-2 drop-shadow-md">{data.hero.title}</h1>
              <p className="text-lg opacity-90">{data.hero.subtitle}</p>
            </div>
            <button onClick={handleSaveSettings} className="absolute top-6 right-6 bg-blue-600 hover:bg-blue-500 p-3 rounded-full text-white shadow-lg transition flex gap-2 items-center z-20">
              <Save size={20} /> <span className="hidden md:inline font-bold">Simpan ke Sheet</span>
            </button>
          </div>

          {/* Content Section */}
          <div className="max-w-6xl mx-auto mt-[-40px] relative z-20 px-4 grid grid-cols-1 md:grid-cols-2 gap-6">

            {/* Manpower */}
            <div className="bg-white rounded-2xl shadow-xl p-6 border-t-4 border-blue-500">
              <h2 className="text-2xl font-bold mb-6 flex items-center gap-2"><Users className="text-blue-500" /> Manpower</h2>
              <div className="grid grid-cols-2 gap-4">
                {data.manpower.map(m => (
                  <div key={m.id} className="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">
                    <div className="bg-blue-100 p-3 rounded-lg text-blue-600"><IconMapper name={m.icon} size={22} /></div>
                    <div>
                      <p className="text-sm text-gray-500 font-medium">{m.label}</p>
                      <p className="text-xl font-black text-slate-700">{m.count}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Units */}
            <div className="bg-white rounded-2xl shadow-xl p-6 border-t-4 border-orange-500">
              <h2 className="text-2xl font-bold mb-6 flex items-center gap-2"><Truck className="text-orange-500" /> Operasional Unit</h2>
              <div className="grid grid-cols-2 gap-4">
                {data.units.map(u => (
                  <div key={u.id} className="flex items-center gap-3 p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition">
                    <div className="bg-orange-100 p-3 rounded-lg text-orange-600"><IconMapper name={u.icon} size={22} /></div>
                    <div>
                      <p className="text-sm text-gray-500 font-medium">{u.label}</p>
                      <p className="text-xl font-black text-slate-700">{u.count}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
